spring.application.name=Api_Gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=customer-service-route

#lb là load balance - tự động cân bằng tải
spring.cloud.gateway.routes[0].uri=lb://CustomerService

spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=customer-service-crud-route
spring.cloud.gateway.routes[1].uri=lb://CustomerService
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**
