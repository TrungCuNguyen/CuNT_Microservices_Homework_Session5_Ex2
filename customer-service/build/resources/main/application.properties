server.port=${PORT:8081}
spring.application.name=CustomerService

# Cấu hình kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:17111998}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Khai báo địa chỉ của Eureka Server để đăng ký
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Hiển thị IP của Service trên Dashboard thay vì hostname (tùy chọn nhưng nên có)
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false
